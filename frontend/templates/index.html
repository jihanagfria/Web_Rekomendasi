<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>MakeMatch &mdash; Sistem Rekomendasi Makeup</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;1,300;1,400&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css', v='70') }}" />
</head>
<body>

  <!-- HEADER -->
  <header class="site-header">
    <div class="header-inner">
      <button type="button" class="logo logo-button" data-view-target="home" aria-label="Kembali ke beranda"><span class="logo-star">&#10022;</span>MakeMatch</button>
      <nav class="main-nav">
        <button type="button" class="nav-link" data-view-target="catalog">Katalog</button>
        <button type="button" class="nav-link" data-view-target="recommendation">Rekomendasi</button>
      </nav>
    </div>
  </header>

  <main>
    <!-- BERANDA -->
    <section class="app-view app-view-home" data-view="home">
      <div class="hero-page-bg" aria-hidden="true"></div>
      <section class="hero">
    <div class="hero-bg"></div>
    <div class="hero-content">
      <!-- <p class="hero-eyebrow">Sistem Rekomendasi Makeup</p> -->
      <h1 class="hero-title">Pilih <em>Base Makeup </em> Sesuai Kebutuhan </h1>
      <!-- <p class="hero-desc">Isi preferensi Anda dan biarkan sistem kami menemukan produk makeup yang paling sesuai dengan kebutuhan dan jenis kulit Anda.</p> -->
       <p></p>
      <button type="button" class="btn-primary" data-view-target="recommendation">Mulai Sekarang</button>
    </div>
    <div class="hero-visual">
      <div class="hero-card hc1">
        <div class="hc-label">&#10022; Temukan</div>
        <div class="hc-step"><span class="hc-inline-star" aria-hidden="true"></span>Base Produk</div>
      </div>
      <div class="hero-card hc2">
        <div class="hc-label">&#10022; Sesuaikan</div>
        <div class="hc-step"><span class="hc-inline-star" aria-hidden="true"></span>Kebutuhan</div>
      </div>
      <div class="hero-card hc3">
        <div class="hc-label">&#10022; Dapatkan</div>
        <div class="hc-step"><span class="hc-inline-star" aria-hidden="true"></span>Rekomendasi</div>
      </div>
      <button type="button" class="btn-primary btn-primary-mobile" data-view-target="recommendation">Mulai Sekarang</button>
    </div>
  </section>

      </section>

    <!-- KATALOG -->
    <section class="app-view is-hidden" data-view="catalog">
      <!-- CATALOG -->
  <section class="catalog-section" id="catalog">
    <div class="section-header catalog-header">
      <h2 class="section-title">Katalog Produk</h2>
    </div>

    <div class="catalog-search">
      <span class="search-icon" aria-hidden="true">&#8981;</span>
      <input
        type="search"
        id="catalogSearch"
        placeholder="Cari produk, merek, subkategori, jenis kulit, atau finish..."
        aria-label="Cari katalog berdasarkan nama, merek, subkategori, jenis kulit, atau finish"
        autocomplete="off"
      />
      <button
        type="button"
        class="search-clear is-hidden"
        id="clearCatalogSearch"
        aria-label="Hapus pencarian"
      >&times;</button>
    </div>

    <div class="catalog-filters">
      <button class="filter-btn active" data-filter="">Semua</button>
      <button class="filter-btn" data-filter="Cushion">Cushion</button>
      <button class="filter-btn" data-filter="Foundation">Foundation</button>
      <button class="filter-btn" data-filter="Skin Tint">Skin Tint</button>
      <button class="filter-btn" data-filter="Powder">Powder</button>
    </div>

    <div class="catalog-grid" id="catalogGrid">
      <!-- Populated by JS -->
    </div>
  </section>

      </section>

    <!-- REKOMENDASI -->
    <section class="app-view is-hidden" data-view="recommendation">
      <!-- PREFERENCE FORM -->
  <section class="pref-section" id="preferences">
    <div class="pref-inner">
      <div class="pref-header">
        <h2 class="section-title">Preferensi Anda</h2>
        <p class="section-sub">Pilih kriteria sesuai preferensi Anda dan temukan rekomendasi terbaik.</p>
      </div>

      <div class="pref-form-wrap">
        <div class="pref-form">

          <div class="form-group">
            <label>Subkategori Produk</label>
            <div class="chip-group" id="chips-subcategory">
              <button class="chip active" data-value="">Semua</button>
              <!-- Pilihan subkategori Base Makeup dibuat otomatis dari products.json -->
            </div>
          </div>

          <div class="form-group">
            <label>Jenis Kulit</label>
            <div class="chip-group" id="chips-skin">
              <button class="chip active" data-value="">Semua</button>
              <button class="chip" data-value="Oily">Berminyak</button>
              <button class="chip" data-value="Dry">Kering</button>
              <button class="chip" data-value="Combination">Kombinasi</button>
              <button class="chip" data-value="Normal">Normal</button>
              <button class="chip" data-value="Acne-Prone">Rentan Jerawat</button>
            </div>
          </div>

          <div class="form-group">
            <label>Hasil Akhir / Efek</label>
            <div class="chip-group" id="chips-finish">
              <button class="chip active" data-value="">Semua</button>
              <!-- Pilihan hasil akhir/efek dibuat otomatis dari products.json -->
            </div>
          </div>

          <div class="form-group">
            <label>Karakteristik Produk</label>
            <div class="chip-group" id="chips-benefit">
              <button class="chip active" data-value="">Semua</button>
              <button class="chip" data-value="Long Lasting">Long Lasting</button>
              <button class="chip" data-value="Oil Control">Oil Control</button>
              <button class="chip" data-value="Lightweight">Lightweight</button>
              <button class="chip" data-value="UV Protection">UV Protection</button>
              <button class="chip" data-value="Coverage">Coverage</button>
              <button class="chip" data-value="Pore Blurring">Pore Blurring</button>
              <button class="chip" data-value="Waterproof">Waterproof</button>
              <button class="chip" data-value="Hydrating">Hydrating</button>
            </div>
          </div>

          <button class="btn-recommend" id="btnRecommend">Rekomendasikan</button>
        </div>
      </div>
    </div>
  </section>

      <!-- RESULTS -->
      <section class="results-section is-hidden" id="resultsSection">
    <div class="section-header">
      <h2 class="section-title">Hasil Rekomendasi</h2>
      <p class="section-sub" id="resultsSubtitle"></p>
    </div>
    <div class="results-grid" id="resultsGrid">
      <!-- Populated by JS -->
    </div>
    <div class="results-actions">
      <button class="btn-reset" id="btnReset">Ubah Preferensi</button>
    </div>
      </section>
    </section>
  </main>
  <script defer src="{{ url_for('static', filename='js/main.js', v='15') }}"></script>
</body>
</html>
